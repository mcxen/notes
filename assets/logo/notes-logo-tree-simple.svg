<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="tile"><rect width="1024" height="1024" rx="180"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <!-- flat sky -->
    <rect width="1024" height="1024" fill="#f0d3a0"/>
    <!-- sun, upper left -->
    <circle cx="230" cy="225" r="128" fill="#e2603a"/>
    <!-- far hill -->
    <path d="M-20 800 Q512 740 1044 800 V1100 H-20 Z" fill="#9aa463"/>
    <!-- trunk -->
    <rect x="482" y="560" width="60" height="340" fill="#4a3327"/>
    <!-- canopy: three big round masses -->
    <g fill="#5d7447">
      <circle cx="512" cy="400" r="230"/>
      <circle cx="310" cy="480" r="170"/>
      <circle cx="715" cy="470" r="170"/>
    </g>
    <!-- one lighter mass for depth -->
    <circle cx="450" cy="310" r="140" fill="#86985a"/>
    <!-- near hill -->
    <path d="M-20 860 Q512 800 1044 860 V1100 H-20 Z" fill="#5d7048"/>
  </g>
</svg>

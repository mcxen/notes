<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e4c2"/>
      <stop offset="0.55" stop-color="#efc48c"/>
      <stop offset="1" stop-color="#e08a66"/>
    </linearGradient>
    <!-- brush-like wobble on painted shapes -->
    <filter id="paint" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="40" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- paper / canvas grain, grayscale -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="9" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="1.8 0 0 0 -0.4  1.8 0 0 0 -0.4  1.8 0 0 0 -0.4  0 0 0 0 1"/>
    </filter>
    <!-- retro sun with horizontal stripes cut out -->
    <mask id="stripes" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <g fill="#000">
        <rect x="0" y="236" width="1024" height="8"/>
        <rect x="0" y="262" width="1024" height="10"/>
        <rect x="0" y="290" width="1024" height="12"/>
      </g>
    </mask>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.62" stop-color="#4a2e1c" stop-opacity="0"/>
      <stop offset="1" stop-color="#4a2e1c" stop-opacity="0.32"/>
    </radialGradient>
    <clipPath id="tile"><rect width="1024" height="1024" rx="180"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- painted sky -->
    <rect width="1024" height="1024" fill="url(#sky)"/>

    <!-- striped sun, upper left, partly behind the canopy -->
    <circle cx="220" cy="200" r="110" fill="#e2603a" mask="url(#stripes)" filter="url(#paint)"/>

    <!-- distant hill -->
    <path d="M-20 800 Q250 720 512 780 T1044 760 V1100 H-20 Z" fill="#9aa463" filter="url(#paint)"/>

    <!-- trunk with a flared base, and branches -->
    <path d="M470 900 Q490 880 486 830 C492 760 496 700 500 580 L524 580 C528 700 532 760 538 830 Q534 880 554 900 Z" fill="#4a3327"/>
    <g fill="none" stroke="#4a3327" stroke-linecap="round" stroke-linejoin="round">
      <path d="M505 640 Q430 600 380 470" stroke-width="26"/>
      <path d="M520 620 Q600 580 660 450" stroke-width="26"/>
      <path d="M500 560 Q470 470 430 400" stroke-width="18"/>
      <path d="M525 560 Q560 480 600 380" stroke-width="18"/>
      <path d="M400 470 Q370 440 340 430" stroke-width="10"/>
      <path d="M660 450 Q690 420 720 410" stroke-width="10"/>
      <path d="M430 400 Q420 360 380 340" stroke-width="8"/>
      <path d="M600 380 Q620 340 660 330" stroke-width="8"/>
    </g>

    <!-- canopy, three painted layers with uneven lobes -->
    <g filter="url(#paint)" fill="#5d7447">
      <circle cx="512" cy="400" r="210"/>
      <circle cx="330" cy="470" r="150"/>
      <circle cx="700" cy="460" r="160"/>
      <circle cx="420" cy="300" r="160"/>
      <circle cx="620" cy="290" r="165"/>
      <circle cx="512" cy="230" r="150"/>
      <circle cx="250" cy="420" r="105"/>
      <circle cx="790" cy="400" r="115"/>
    </g>
    <g filter="url(#paint)" fill="#86985a">
      <circle cx="500" cy="380" r="170"/>
      <circle cx="340" cy="440" r="110"/>
      <circle cx="690" cy="430" r="120"/>
      <circle cx="430" cy="300" r="120"/>
      <circle cx="610" cy="290" r="120"/>
      <circle cx="265" cy="430" r="70"/>
    </g>
    <g filter="url(#paint)" fill="#bfb669">
      <circle cx="470" cy="330" r="100"/>
      <circle cx="620" cy="380" r="80"/>
      <circle cx="380" cy="380" r="70"/>
      <circle cx="560" cy="250" r="80"/>
    </g>
    <g filter="url(#paint)" fill="#e6d799">
      <circle cx="430" cy="260" r="38"/>
      <circle cx="520" cy="200" r="30"/>
      <circle cx="330" cy="400" r="30"/>
      <circle cx="640" cy="300" r="32"/>
      <circle cx="470" cy="420" r="25"/>
    </g>

    <!-- a few leaves drifting down past the trunk -->
    <g>
      <ellipse cx="300" cy="690" rx="20" ry="11" transform="rotate(-30 300 690)" fill="#d9703f"/>
      <ellipse cx="730" cy="650" rx="18" ry="10" transform="rotate(25 730 650)" fill="#e0a53a"/>
      <ellipse cx="660" cy="735" rx="15" ry="8" transform="rotate(-12 660 735)" fill="#d9703f"/>
    </g>

    <!-- foreground hill -->
    <path d="M-20 860 Q300 800 600 850 T1044 840 V1100 H-20 Z" fill="#5d7048" filter="url(#paint)"/>

    <!-- paper grain and vignette -->
    <rect width="1024" height="1024" filter="url(#grain)" opacity="0.22" style="mix-blend-mode:multiply"/>
    <rect width="1024" height="1024" fill="url(#vig)"/>
  </g>

  <!-- thin print border -->
  <rect x="36" y="36" width="952" height="952" rx="150" fill="none" stroke="#f7ecd3" stroke-width="6" opacity="0.75"/>
</svg>
